name: RainLang Compiler CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          cmake \
          bison

    - name: Configure build
      run: |
        cmake -B build -S .

    - name: Build
      run: |
        cmake --build build

    - name: Run parser tests
      run: |
        chmod +x tests/run_scanner_and_parser_tests.sh
        ./tests/run_scanner_and_parser_tests.sh